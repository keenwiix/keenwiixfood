/* Хелперы */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const has=(r,list)=>Object.keys(r.i).some(k=>list.includes(k));

function dietOk(r,a){
 const d=a.diet||'all';
 if(d==='all')return true;
 if(has(r,MEAT))return false;
 if((d==='veg'||d==='vegan')&&has(r,FISH))return false;
 if((d==='nodairy'||d==='vegan')&&has(r,DAIRY))return false;
 if(d==='vegan'&&has(r,EGG))return false;
 return true;
}

function disSet(a){
  const s=[];
  (a.dislikes||[]).forEach(k => {
    (DMAP[k] || [k]).forEach(x => s.push(x));
  });
  return s;
}

function pool(m,a){
 // Базовый пул по категории, диете и ПРАВИЛУ БЕЛОК > ЖИР
 let base = RECIPES.filter(r => r.m===m && dietOk(r,a) && r.p > r.f);
 
 // В дискаунтере убираем дорогие продукты
 if(a.store==='disc'){
   const expensive=['salmon','quinoa','tofu','greek','turkey'];
   base = base.filter(r => !Object.keys(r.i).some(k=>expensive.includes(k)));
 }
 
 const dis = disSet(a);
 // Сначала пытаемся найти блюда, где нет НИ ОДНОГО disliked ингредиента
 let list = base.filter(r => !has(r, dis));
 
 // Если таких нет (например, выбрали "Курица" и "Рис", а всё меню на них), 
 // возвращаем пустой список, чтобы слот остался пустым (честно) 
 return {list, level: list.length ? 0 : 1};
}

function unitCost(r){
 let s=0;
 for(const k in r.i){
  const g=ING[k]; if(!g) continue;
  s += r.i[k] * g.p / (g.packSize||1);
 }
 return s;
}
const factor=a=>(+a.people||1)*({lose:.85,keep:1,gain:1.2}[a.goal]||1);
const storeMult=a=>STORE_MULT[a.store]||1;

function pick(arr,w,rng){
 const sum=w.reduce((x,y)=>x+y,0);let t=rng()*sum;
 for(let i=0;i<arr.length;i++){t-=w[i];if(t<=0)return arr[i]}
 return arr[arr.length-1];
}

function sequence(m,a,rng,bias){
 const {list} = pool(m,a);
 if(!list.length) return {out: Array(7).fill(null), level: 1}; // если вообще нет блюд
 
 const f=factor(a);
 const sorted=[...list].sort((x,y)=>unitCost(x)*f-unitCost(y)*f);
 let recent=[]; const out=[];
 
 for(let d=0;d<7;d++){
  let c=sorted.filter(r=>!recent.includes(r.id));
  if(!c.length)c=sorted;
  const w=c.map((r,i)=>Math.exp(-bias*i/Math.max(1,c.length-1)));
  const r=pick(c,w,rng);
  out[d]=r.id;
  recent.push(r.id);
  if(recent.length>3) recent.shift(); // храним 3 последних, чтобы не повторялось
 }
 return {out, level: 0};
}

function shopping(plan,f){
 const tot={};
 plan.forEach(day=>day.forEach(e=>{
  if(!e) return;
  const r=RID[e.id]; if(!r) return;
  for(const k in r.i) tot[k]=(tot[k]||0)+r.i[k]*f;
 }));
 return Object.keys(tot).map(k=>{
  const g=ING[k]; if(!g) return null;
  const need=tot[k];
  const packSize=g.packSize||1;
  const packs=Math.max(1, Math.ceil(need/packSize - 1e-9));
  const q=packs*packSize;
  const cost=packs*g.p;
  return {k,n:g.n,u:g.u,q,packs,packSize,c:g.c,cost};
 }).filter(Boolean);
}

function totals(a,plan){
 const items=shopping(plan,factor(a));
 const mult=storeMult(a);
 const total=Math.round(items.reduce((s,i)=>s+i.cost,0)*mult/10)*10;
 return{items,total};
}

function generate(a){
 const slots=['b','l','d'];
 let best=null,relaxed=false;
 for(let i=0;i<8;i++){
  const rng=mulberry32((a.seed||1)+i*7919);
  const seqs={};let rel=false;
  slots.forEach(m=>{
    const s=sequence(m,a,rng,i);
    seqs[m]=s.out;
    if(s.level>0) rel=true;
  });
  
  const plan=[];
  for(let d=0;d<7;d++){
    plan.push(slots.map(m=>{
      const id = seqs[m][d];
      return id ? {m, id} : null;
    }).filter(Boolean));
  }
  
  const t=totals(a,plan);
  if(!best||t.total<best.total){
    best={plan,total:t.total};
    relaxed=rel;
  }
  if(t.total<=a.budget){
    best={plan,total:t.total};
    relaxed=rel;
    break;
  }
 }
 return{plan:best.plan,relaxed};
}

function swap(a,plan,d,m,rng){
 const cur=plan[d]?.find(e=>e.m===m);
 if(!cur) return false;
 const {list}=pool(m,a);
 const c=list.filter(r=>r.id!==cur.id&&!plan[d].some(e=>e.id===r.id));
 if(!c.length)return false;
 cur.id=c[Math.floor(rng()*c.length)].id;
 return true;
}

const money=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')+'\u00a0₽';
function qty(u,q,round){
 if(u==='pcs'){return Math.round(q)+' шт.'}
 if(round){const s=q<100?5:10;q=Math.round(q/s)*s;q=Math.max(q,5)}
 if(q>=1000)return(q/1000).toFixed(1).replace('.',',').replace(',0','')+(u==='ml'?' л':' кг');
 return q+(u==='ml'?' мл':' г');
}

const dayMacro=(a,day,key)=>{
  const g={lose:.85,keep:1,gain:1.2}[a.goal]||1;
  return Math.round(day.reduce((s,e)=>s+(RID[e.id]?.[key]||0),0)*g*10)/10;

 }else if(q.type==='multi'){
  const sel=S.a.dislikes||[];
  body=`<div class="chips">${DISLIKES.map(d=>`<button class="chip" data-a="dis" data-v="${d[0]}" aria-pressed="${sel.includes(d[0])}">${esc(d[1])}</button>`).join('')}</div>`;next=true;
 }else if(q.type==='count'){
  const n=S.a.people||1;
  body=`<div class="stepper"><button data-a="dec" aria-label="Меньше">−</button><output aria-live="polite">${n}</output><button data-a="inc" aria-label="Больше">+</button></div>`;next=true;
 }else if(q.type==='range'){
  body=`<div class="big" id="bv">${money(S.a.budget)}</div><input type="range" data-range min="${q.min}" max="${q.max}" step="${q.step}" value="${S.a.budget}" aria-label="Бюджет на неделю"><div class="scale"><span>${money(q.min)}</span><span>${money(q.max)}</span></div>`;next=true;
 }
 return `<p class="kicker">Вопрос ${S.i+1} из ${QUESTIONS.length}</p><h2>${esc(q.t)}</h2><p class="sub">${esc(q.sub||'')}</p>${body}
 <div class="row"><button class="btn ghost" data-a="back">Назад</button>${next?`<button class="btn" data-a="next">${S.i===QUESTIONS.length-1?'Собрать меню':'Далее'}</button>`:''}</div>`;
}

function loading(){
 return `<div class="load" role="status"><h2 style="margin:0 0 16px">Собираем меню…</h2><div class="skel" style="width:60%"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:50%"></div><p class="sub">Подбираем блюда</p></div>`;
}

function macrosLine(r){
 return `${r.k} ккал · Б ${r.p} · Ж ${r.f} · У ${r.c}`;
}

function recipeHtml(r,f){
 const ing=Object.keys(r.i).map(k=>{
  const g=ING[k]; if(!g) return '';
  return `<li>${esc(g.n)} — ${qty(g.u,r.i[k]*f,true)}</li>`;
 }).join('');
 return `<div class="det"><ul>${ing}</ul><p>${esc(r.s)}</p></div>`;
}

function result(){
 const a=S.a,f=factor(a),t=totals(a,S.plan),est=Math.round(t.total);
 const over=est-a.budget;
 const fit=over<=0?`Укладываемся в бюджет ${money(a.budget)}.`:`Выше бюджета на ${money(over)}. Увеличьте бюджет или выберите дискаунтер.`;
 const tabs=`<div class="tabs" role="tablist"><button class="tab" role="tab" data-a="tab" data-v="plan" aria-selected="${S.tab==='plan'}">Меню</button><button class="tab" role="tab" data-a="tab" data-v="shop" aria-selected="${S.tab==='shop'}">Покупки</button></div>`;
 let body='';
 
 if(S.tab==='plan'){
  body=S.plan.map((day,d)=>{
    if(!day.length) return '';
    return `<section class="day"><div class="dh"><h3>${DAYS[d]}</h3><span>≈ ${dayKcal(a,day)} ккал · Б ${dayMacro(a,day,'p')} · Ж ${dayMacro(a,day,'f')} · У ${dayMacro(a,day,'c')}</span></div>`+day.map(e=>{
     const r=RID[e.id],key=d+'-'+e.m,open=!!S.open[key];
     if(!r) return '';
     return `<div class="meal"><div class="ml"><span>${SLOT[e.m]}</span><button class="lnk" data-a="swap" data-d="${d}" data-m="${e.m}">Заменить</button></div><button class="mn" data-a="toggle" data-k="${key}" aria-expanded="${open}">${esc(r.n)}<small>${r.t} мин · ${open?'скрыть':'рецепт'}</small><span class="macros">${macrosLine(r)}</span></button>${open?recipeHtml(r,f):''}</div>`;
    }).join('')+`</section>`;
  }).join('');
 } else {
  const by={};t.items.forEach(i=>(by[i.c]=by[i.c]||[]).push(i));
  const done=t.items.filter(i=>S.checked[i.k]).length;
  const groups=Object.keys(by).sort();
  body=`<p class="fine" id="cnt">Куплено ${done} из ${t.items.length}</p>`+groups.map(g=>`<div class="grp"><h3>${g}</h3>`+by[g].sort((x,y)=>x.n.localeCompare(y.n,'ru')).map(i=>`<label class="it${S.checked[i.k]?' done':''}"><input type="checkbox" data-check="${i.k}"${S.checked[i.k]?' checked':''}><span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span><span>${esc(i.n)}</span><b>${i.u==='pcs'?Math.round(i.q)+' шт.':qty(i.u,i.q,false)}${i.packs>1?`<small>${i.packs} упак.</small>`:''}</b></label>`).join('')+`</div>`).join('')+
  `<div class="row"><button class="btn sm" data-a="copy">Скопировать список</button><button class="btn sm ghost" data-a="print">Распечатать</button></div>`;
 }
 
 return `<p class="kicker">Ваш план</p><h2>Меню на 7 дней</h2>
 <div class="sum"><div class="n" id="sumN" data-target="${est}">≈ ${money(est)}</div><p>на ${a.people} чел. на неделю. ${fit}</p><div class="src">Цены: ${esc(PRICE_META.source)} · ${esc(PRICE_META.updatedAt)}</div></div>
 ${S.relaxed?'<div class="note">Из-за фильтров (нелюбимые продукты или белок < жира) некоторые блюда были исключены. Меню может быть однообразным.</div>':''}
 ${a.store==='disc'?'<div class="note">В дискаунтере дорогие продукты исключены из подбора.</div>':''}
 ${tabs}${body}
 <div class="row"><button class="btn ghost sm" data-a="regen">Собрать заново</button><button class="btn ghost sm" data-a="restart">Пройти тест заново</button></div>
 <div class="foot">Цены ориентировочные. Калорийность и КБЖУ приблизительные. Это не медицинская рекомендация.</div>`;
}

function countUp(){
 const el=document.getElementById('sumN'); if(!el) return;
 const target=+el.dataset.target||0;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent='≈ '+money(target);return}
 const dur=700, t0=performance.now();
 function step(t){
  const p=Math.min(1,(t-t0)/dur), v=Math.round(target*(1-Math.pow(1-p,3)));
  el.textContent='≈ '+money(v);
  if(p<1)requestAnimationFrame(step);
 }
 requestAnimationFrame(step);
}

function render(){
 let m='';
 if(S.screen==='intro')m=intro();else if(S.screen==='quiz')m=quiz();else if(S.screen==='load')m=loading();else m=result();
 app.innerHTML=head()+m;
 if(S.screen==='result'&&S.tab==='plan')countUp();
}

function go(screen){
 S.screen=screen;render();window.scrollTo(0,0);
}

function build(){
 S.screen='load';render();window.scrollTo(0,0);
 setTimeout(()=>{
  if(!S.a.seed)S.a.seed=Math.floor(Math.random()*1e9)+1;
  const g=generate(S.a);
  S.plan=g.plan;S.relaxed=g.relaxed;S.checked={};S.open={};S.tab='plan';save();go('result');
 },800);
}

function nextQ(){
 if(S.i<QUESTIONS.length-1){S.i++;prep();go('quiz')}else build();
}

function prep(){
 const q=QUESTIONS[S.i];
 if(q.id==='people'&&!S.a.people)S.a.people=1;
 if(q.id==='budget'){
   const def=(S.a.people||1)*2500;
   if(!S.a.budget || S.a.budget === S.a._prevBudget) S.a.budget = def;
   S.a._prevBudget = S.a.budget;
 }
}

function copyText(){
 const t=totals(S.a,S.plan),by={};t.items.forEach(i=>(by[i.c]=by[i.c]||[]).push(i));
 return 'keenwiix food — список покупок\n\n'+Object.keys(by).sort().map(g=>g+'\n'+by[g].map(i=>'— '+i.n+': '+qty(i.u,i.q,false)+(i.packs>1?` (${i.packs} упак.)`:'')).join('\n')).join('\n\n');
}

function copy(btn){
 const text=copyText();
 const done=()=>{btn.textContent='Скопировано';setTimeout(()=>{btn.textContent='Скопировать список'},1500)};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback)}else fallback();
 function fallback(){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}
}

app.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,v=t.dataset.v;
  if(a==='home'){go('intro')}
 else if(a==='start'){S.a={};S.i=0;prep();go('quiz')}
 else if(a==='resume')go('result')
 else if(a==='theme'){ /* Тема зафиксирована, кнопка ничего не делает */ }
 else if(a==='back'){if(S.i>0){S.i--;go('quiz')}else go('intro')}
 else if(a==='next')nextQ()
 else if(a==='pick'){S.a[QUESTIONS[S.i].id]=v;render();setTimeout(nextQ,160)}
 else if(a==='dis'){const s=S.a.dislikes||(S.a.dislikes=[]);const i=s.indexOf(v);if(i<0)s.push(v);else s.splice(i,1);render()}
 else if(a==='inc'){S.a._prevBudget=S.a.budget;S.a.people=Math.min(6,(S.a.people||1)+1);render()}
 else if(a==='dec'){S.a._prevBudget=S.a.budget;S.a.people=Math.max(1,(S.a.people||1)-1);render()}
 else if(a==='tab'){S.tab=v;render()}
 else if(a==='toggle'){S.open[t.dataset.k]=!S.open[t.dataset.k];render()}
 else if(a==='swap'){swap(S.a,S.plan,+t.dataset.d,t.dataset.m,Math.random);save();render()}
 else if(a==='regen'){S.a.seed=Math.floor(Math.random()*1e9)+1;build()}
 else if(a==='restart'){S.a={};S.i=0;prep();go('quiz')}
 else if(a==='copy')copy(t)
 else if(a==='print')window.print();
});
app.addEventListener('input',e=>{
 if(e.target.matches('[data-range]')){S.a.budget=+e.target.value;document.getElementById('bv').textContent=money(S.a.budget)}
});
app.addEventListener('change',e=>{
 const c=e.target.closest('[data-check]');if(!c)return;
 S.checked[c.dataset.check]=c.checked;c.closest('.it').classList.toggle('done',c.checked);save();
 const items=totals(S.a,S.plan).items, n=items.length, d=items.filter(i=>S.checked[i.k]).length;
 const el=document.getElementById('cnt');if(el)el.textContent='Куплено '+d+' из '+n;
});

// Инициализация интерфейса
(async()=>{
 render();
 if('serviceWorker' in navigator){
  try{ await navigator.serviceWorker.register('sw.js'); }catch(e){}
 }
})();

}

// Экспорт для тестов (если нужно)
if(typeof module!=='undefined')module.exports={generate,totals,pool,RECIPES,ING,qty,dayKcal,swap,mulberry32,QUESTIONS};
</script>
</body>
</html>
