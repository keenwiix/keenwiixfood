<style>
:root{
  --bg:#fff; --fg:#0a0a0a; --mut:#707070; --line:#e8e8e8; --soft:#f6f6f6;
  --accent1:#ff6b35; --accent2:#ff2e63; --accent3:#ffb800;
  --r-card:28px; --r-btn:999px; --r-input:24px; --r-chip:999px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --shadow-btn:0 6px 0 rgba(0,0,0,.15), 0 12px 24px -6px rgba(255,46,99,.45);
  --shadow-card:0 24px 48px -24px rgba(0,0,0,.3);
}
:root[data-theme="dark"]{
  --bg:#0b0b0f; --fg:#f4f4f4; --mut:#9a9a9a; --line:#26262e; --soft:#16161c;
  --shadow-btn:0 6px 0 rgba(0,0,0,.6), 0 12px 24px -6px rgba(255,46,99,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;color:var(--fg);
  font:16px/1.5 -apple-system,"Inter","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition:background .3s var(--ease),color .3s var(--ease);
  background:
    radial-gradient(900px 600px at 15% -10%, color-mix(in srgb, var(--accent1) 15%, transparent), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, color-mix(in srgb, var(--accent2) 12%, transparent), transparent 55%),
    var(--bg);
  background-attachment: fixed;
}
button{font:inherit;color:inherit;background:none;border:0}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 96px}
@view-transition{navigation:auto}
::view-transition-old(root){animation:vtOut .2s var(--ease) both}
::view-transition-new(root){animation:vtIn .28s var(--ease-out) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-4px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(8px)}}

.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0;gap:12px}
.logo{font-weight:900;letter-spacing:-.06em;font-size:24px;cursor:pointer;padding:0;transition:transform .2s var(--ease)}
.logo:hover{transform:scale(1.05)}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--fg);padding:4px 12px;border-radius:999px;font-weight:800}
.theme-btn{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg);cursor:pointer;
  display:grid;place-items:center;transition:transform .3s var(--ease),border-color .2s var(--ease);
}
.theme-btn:hover{border-color:var(--accent2);transform:rotate(-20deg) scale(1.05)}
.theme-btn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .sun{display:none}
.theme-btn .moon{display:block}
:root[data-theme="dark"] .theme-btn .sun{display:block}
:root[data-theme="dark"] .theme-btn .moon{display:none}

.bar{height:12px;border-radius:999px;background:var(--soft);margin-bottom:24px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.05)}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));background-size:200% 100%;transition:width .5s var(--ease-out);animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}

h1{font-size:clamp(42px,12vw,76px);line-height:.98;letter-spacing:-.05em;margin:48px 0 20px;font-weight:900;animation:heroIn .7s var(--ease-out) both}
@keyframes heroIn{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
h2{font-size:clamp(30px,8vw,44px);letter-spacing:-.04em;line-height:1.05;margin:32px 0 12px;font-weight:900}
.lead{font-size:19px;color:var(--mut);margin:0 0 32px;max-width:30em;animation:heroIn .7s var(--ease-out) .06s both}
.sub{color:var(--mut);margin:0 0 28px;font-size:17px}
.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:8px}

.btn{
  display:inline-block;border-radius:var(--r-btn);border:0;padding:18px 34px;cursor:pointer;
  font-weight:800;font-size:17px;letter-spacing:-.01em;color:#fff;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  box-shadow:var(--shadow-btn);position:relative;
  transition:transform .12s var(--ease),box-shadow .12s var(--ease),filter .2s var(--ease);
}
.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 9px 0 rgba(0,0,0,.15),0 18px 30px -8px rgba(255,46,99,.55)}
.btn:active{transform:translateY(4px) scale(.99);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.ghost{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 rgba(0,0,0,.05)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--fg),0 8px 16px -8px rgba(0,0,0,.25)}
.btn.ghost:active{transform:translateY(2px)}
.btn.sm{padding:12px 24px;font-size:15px}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:28px}
.fine{font-size:13px;color:var(--mut);margin-top:20px}

.opt{
  display:block;width:100%;text-align:left;padding:20px 24px;
  border:2px solid var(--line);border-radius:var(--r-input);background:var(--bg);color:var(--fg);
  cursor:pointer;margin-bottom:12px;font-weight:600;font-size:17px;
  transition:transform .15s var(--ease-out),border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s;
  animation:fadeUp .4s var(--ease-out) both;
}
.opt:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 8px 20px -12px rgba(255,46,99,.3)}
.opt small{display:block;color:var(--mut);font-size:14px;font-weight:500;margin-top:4px}
.opt[aria-pressed=true]{
  background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border-color:transparent;
  box-shadow:0 8px 20px -8px rgba(255,46,99,.6);transform:scale(1.01);
}
.opt[aria-pressed=true] small{color:rgba(255,255,255,.85)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  padding:12px 22px;border:2px solid var(--line);border-radius:var(--r-chip);
  background:var(--bg);color:var(--fg);cursor:pointer;font-weight:700;font-size:15px;
  transition:transform .15s var(--ease-out),border-color .2s,background .2s,color .2s,box-shadow .2s;
}
.chip:hover{border-color:var(--accent2);transform:translateY(-2px) scale(1.03)}
.chip[aria-pressed=true]{
  background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border-color:transparent;
  box-shadow:0 6px 16px -6px rgba(255,46,99,.55);animation:pop .3s var(--ease-out);
}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

.stepper{display:flex;align-items:center;gap:28px;margin:28px 0}
.stepper button{
  width:64px;height:64px;border-radius:50%;border:0;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;
  font-size:32px;font-weight:800;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.15),0 10px 20px -8px rgba(255,46,99,.5);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease);
}
.stepper button:hover{transform:translateY(-2px) scale(1.05)}
.stepper button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.stepper output{font-size:64px;font-weight:900;letter-spacing:-.05em;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;animation:numIn .3s var(--ease-out)}
@keyframes numIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}

.big{
  font-size:64px;font-weight:900;letter-spacing:-.05em;margin:16px 0;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
input[type=range]{
  width:100%;height:12px;border-radius:999px;margin:16px 0 8px;
  accent-color:var(--accent2);background:var(--soft);
}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-weight:600}

.load{padding:80px 0;text-align:center}
.skel{height:24px;background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);background-size:400% 100%;animation:sk 1.2s infinite linear;border-radius:999px;margin:16px auto}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

.sum{
  border-radius:var(--r-card);padding:32px;margin:24px 0;
  background:linear-gradient(160deg, color-mix(in srgb, var(--accent1) 12%, var(--bg)), var(--bg));
  box-shadow:var(--shadow-card);
  animation:cardIn .5s var(--ease-out) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.sum .n{font-size:clamp(40px,10vw,56px);font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:8px}
.sum p{margin:0;color:var(--mut);font-size:15px;font-weight:500}
.src{font-size:12px;color:var(--mut);margin-top:12px;opacity:.8}
.note{
  background:color-mix(in srgb, var(--accent3) 15%, var(--bg));
  padding:16px 20px;border-radius:16px;font-size:14px;margin:16px 0;
  border:2px dashed color-mix(in srgb, var(--accent3) 40%, transparent);
  animation:fadeUp .35s var(--ease-out) both;
}

.tabs{
  display:flex;gap:6px;padding:6px;margin:32px 0 16px;
  background:var(--soft);border-radius:var(--r-btn);
}
.tab{
  flex:1;padding:14px;border:0;border-radius:var(--r-btn);cursor:pointer;
  font-weight:800;font-size:15px;color:var(--mut);background:transparent;
  transition:background .25s var(--ease),color .25s var(--ease),box-shadow .25s;
}
.tab[aria-selected=true]{
  color:#fff;background:linear-gradient(135deg,var(--accent1),var(--accent2));
  box-shadow:0 6px 16px -8px rgba(255,46,99,.6);
}

.day{
  border-radius:var(--r-card);padding:24px;margin-top:20px;
  background:var(--bg);box-shadow:var(--shadow-card);
  animation:fadeUp .5s var(--ease-out) both;
}
.day:nth-child(1){animation-delay:.02s}.day:nth-child(2){animation-delay:.06s}.day:nth-child(3){animation-delay:.10s}
.day:nth-child(4){animation-delay:.14s}.day:nth-child(5){animation-delay:.18s}.day:nth-child(6){animation-delay:.22s}
.day:nth-child(7){animation-delay:.26s}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.dh h3{margin:0;font-size:24px;letter-spacing:-.03em;font-weight:900}
.dh span{font-size:12px;color:var(--mut);text-align:right;font-weight:600;line-height:1.4}
.meal{border-top:2px dashed var(--line);padding:16px 0}
.meal:first-of-type{border-top:0}
.ml{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:6px}
.lnk{
  background:transparent;border:0;padding:4px 10px;cursor:pointer;
  text-decoration:none;font-size:12px;color:var(--accent2);text-transform:none;letter-spacing:0;
  border-radius:999px;font-weight:800;
  transition:background .2s,color .2s;
}
.lnk:hover{background:color-mix(in srgb, var(--accent2) 12%, transparent)}
.mn{
  display:block;width:100%;text-align:left;background:none;border:0;padding:6px 0;
  cursor:pointer;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--fg);
}
.mn small{display:block;font-size:13px;font-weight:600;color:var(--mut);letter-spacing:0;margin-top:4px}
.mn .macros{display:inline-block;margin-top:6px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:0}
.det{
  padding:14px 18px;font-size:15px;border-radius:16px;margin-top:10px;
  background:var(--soft);animation:expand .3s var(--ease-out);
}
@keyframes expand{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.det ul{margin:0 0 10px;padding-left:20px}
.det li{margin:4px 0}
.det p{margin:8px 0 0;color:var(--fg);opacity:.9}
.det .serv{font-size:12px;color:var(--mut);margin:4px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}

.grp{margin-top:28px;animation:fadeUp .4s var(--ease-out) both}
.grp h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;font-weight:900}
.it{
  display:flex;gap:14px;align-items:center;padding:14px 12px;
  border-bottom:1px solid var(--line);cursor:pointer;position:relative;
  border-radius:16px;transition:background .2s var(--ease);
}
.it:hover{background:var(--soft)}
.it input{position:absolute;opacity:0;pointer-events:none}
.it .box{
  width:26px;height:26px;border:2px solid var(--fg);border-radius:50%;flex:none;
  display:grid;place-items:center;position:relative;
  transition:background .2s var(--ease),border-color .2s var(--ease);
}
.it .box svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .35s var(--ease-out)}
.it.done .box{background:linear-gradient(135deg,var(--accent1),var(--accent2));border-color:transparent}
.it.done .box svg{stroke-dashoffset:0}
.it span:not(.box){flex:1;transition:color .25s var(--ease),opacity .25s var(--ease);font-weight:600}
.it b{font-weight:800;white-space:nowrap;transition:color .25s var(--ease);color:var(--accent2)}
.it b small{display:block;font-weight:600;color:var(--mut);font-size:11px;letter-spacing:0;text-align:right;margin-top:2px}
.it.done span:not(.box){color:var(--mut);text-decoration:line-through;text-decoration-thickness:1.5px}
.it.done b{color:var(--mut)}

.foot{margin-top:56px;font-size:13px;color:var(--mut);border-top:1px solid var(--line);padding-top:20px;line-height:1.6}
.offline{
  position:fixed;left:16px;right:16px;bottom:16px;border-radius:999px;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;font-size:14px;font-weight:800;
  text-align:center;padding:14px;transform:translateY(150%);transition:transform .35s var(--ease-out);z-index:50;
  box-shadow:var(--shadow-btn);
}
.offline[aria-hidden=false]{transform:none}
.install{display:none}
.install[data-show=true]{display:inline-block;animation:pop .3s var(--ease-out)}

@media (min-width:720px){
 .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
 .cols .grp{margin-top:12px}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
 .top,.bar,.tabs,.row,.lnk,.foot,.note,.offline,.install,.theme-btn{display:none!important}
 .wrap{padding:0}.it{break-inside:avoid}
 .day,.sum{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>

<script>

/* ================= THEME ================= */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', t==='dark'?'#0b0b0f':'#000000');
}
function initTheme(){
  const saved=localStorage.getItem('keenwiix-theme');
  const sys=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  applyTheme(saved||sys);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'light';
  const next=cur==='dark'?'light':'dark';
  applyTheme(next);
  localStorage.setItem('keenwiix-theme',next);
}
initTheme();

async function loadPrices(){
  try{
    const r = await fetch('prices.json', {cache:'no-cache'});
    if(!r.ok) return;
    const j = await r.json();
    if(!j || !j.items) return;
    const next = {};
    for(const k in j.items){
      const it = j.items[k];
      next[k] = {n:it.n, u:it.u, packSize:it.pack, p:it.price, c:it.c};
    }
    ING = next;
    PRICE_META = {source:j.source||'Супермаркет', updatedAt:j.updatedAt||''};
  }catch(e){}
}

/* ================= LOGIC ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const has=(r,list)=>Object.keys(r.i).some(k=>list.includes(k));
function dietOk(r,a){
 const d=a.diet||'all';
 if(d==='all')return true;
 if(has(r,MEAT))return false;
 if((d==='veg'||d==='vegan')&&has(r,FISH))return false;
 if((d==='nodairy'||d==='vegan')&&has(r,DAIRY))return false;
 if(d==='vegan'&&has(r,EGG))return false;
 return true;
}
function disSet(a){const s=[];(a.dislikes||[]).forEach(k=>(DMAP[k]||[k]).forEach(x=>s.push(x)));return s}
function pool(m,a){
 let base=RECIPES.filter(r=>r.m===m&&dietOk(r,a));
 if(a.store==='disc'){
   const expensive=['salmon','quinoa','tofu','greek','turkey'];
   base=base.filter(r=>!Object.keys(r.i).some(k=>expensive.includes(k)));
 }
 const dis=disSet(a),lim=+a.time||0;
 const levels=[r=>!has(r,dis)&&(!lim||r.t<=lim),r=>!has(r,dis),()=>true];
 for(let i=0;i<3;i++){
  const list=base.filter(levels[i]);
  if(list.length>=2||(i===2&&list.length>0))return{list,level:i};
 }
 return{list:base,level:2};
}
function unitCost(r){
 let s=0;
 for(const k in r.i){
  const g=ING[k]; if(!g) continue;
  s += r.i[k] * g.p / (g.packSize||1);
 }
 return s;
}
const factor=a=>(+a.people||1)*({lose:.85,keep:1,gain:1.2}[a.goal]||1);
const storeMult=a=>STORE_MULT[a.store]||1;
function pick(arr,w,rng){
 const sum=w.reduce((x,y)=>x+y,0);let t=rng()*sum;
 for(let i=0;i<arr.length;i++){t-=w[i];if(t<=0)return arr[i]}
 return arr[arr.length-1];
}
function sequence(m,a,rng,bias){
 const {list,level}=pool(m,a);
 const sorted=[...list].sort((x,y)=>unitCost(x)-unitCost(y));
 const step=(a.batch==='yes'&&(m==='l'||m==='d'))?2:1;
 const keep=Math.min(3,sorted.length-1);
 let recent=[];const out=[];
 for(let d=0;d<7;d+=step){
  let c=sorted.filter(r=>!recent.includes(r.id));
  if(!c.length)c=sorted;
  const w=c.map((r,i)=>Math.exp(-bias*i/Math.max(1,c.length-1)));
  const r=pick(c,w,rng);
  for(let j=0;j<step&&d+j<7;j++)out[d+j]=r.id;
  recent.push(r.id);if(keep>0)recent=recent.slice(-keep);else recent=[];
 }
 return{out,level};
}
function shopping(plan,f){
 const tot={};
 plan.forEach(day=>day.forEach(e=>{
const r=RID[e.id]; if(!r) return;
  for(const k in r.i) tot[k]=(tot[k]||0)+r.i[k]*f;
 }));
 return Object.keys(tot).map(k=>{
  const g=ING[k]; if(!g) return null;
  const need=tot[k];
  const packSize=g.packSize||1;
  const packs=Math.max(1, Math.ceil(need/packSize - 1e-9));
  const q=packs*packSize;
  const cost=packs*g.p;
  return {k,n:g.n,u:g.u,q,packs,packSize,c:g.c,cost};
 }).filter(Boolean);
}
function totals(a,plan){
 const items=shopping(plan,factor(a));
 const mult=storeMult(a);
 const total=Math.round(items.reduce((s,i)=>s+i.cost,0)*mult/10)*10;
 return{items,total};
}
function generate(a){
 const slots=a.snack==='4'?['b','l','d','s']:['b','l','d'];
 let best=null,relaxed=false;
 for(let i=0;i<8;i++){
  const rng=mulberry32((a.seed||1)+i*7919);
  const seqs={};let rel=false;
  slots.forEach(m=>{const s=sequence(m,a,rng,i);seqs[m]=s.out;if(s.level>0)rel=true});
  const plan=[];
  for(let d=0;d<7;d++)plan.push(slots.map(m=>({m,id:seqs[m][d]})));
  const t=totals(a,plan);
  if(!best||t.total<best.total){best={plan,total:t.total};relaxed=rel}
  if(t.total<=a.budget){best={plan,total:t.total};relaxed=rel;break}
 }
 return{plan:best.plan,relaxed};
}
function swap(a,plan,d,m,rng){
 const cur=plan[d].find(e=>e.m===m);
 const {list}=pool(m,a);
 const c=list.filter(r=>r.id!==cur.id&&!plan[d].some(e=>e.id===r.id));
 if(!c.length)return false;
 cur.id=c[Math.floor(rng()*c.length)].id;return true;
}
const money=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')+'\u00a0₽';
function qty(u,q,round){
 if(u==='pcs'){return Math.round(q)+' шт.'}
 if(round){const s=q<100?5:10;q=Math.round(q/s)*s;q=Math.max(q,5)}
 if(q>=1000)return(q/1000).toFixed(1).replace('.',',').replace(',0','')+(u==='ml'?' л':' кг');
 return q+(u==='ml'?' мл':' г');
}

const dayMacro=(day,key)=>Math.round(day.reduce((s,e)=>s+(RID[e.id]?.[key]||0),0)*10)/10;

 const a=S.a,f=factor(a),t=totals(a,S.plan),est=Math.round(t.total);
 const over=est-a.budget;
 const fit=over<=0?`Укладываемся в бюджет ${money(a.budget)}.`:`Выше бюджета на ${money(over)}. Увеличьте бюджет, выберите дискаунтер или соберите план заново.`;
 const tabs=`<div class="tabs" role="tablist"><button class="tab" role="tab" data-a="tab" data-v="plan" aria-selected="${S.tab==='plan'}">Меню</button><button class="tab" role="tab" data-a="tab" data-v="shop" aria-selected="${S.tab==='shop'}">Покупки</button></div>`;
 let body='';
 if(S.tab==='plan'){
  body=S.plan.map((day,d)=>`<section class="day"><div class="dh"><h3>${DAYS[d]}</h3><span>≈ ${dayKcal(a,day)} ккал · Б ${dayMacro(day,'p')} · Ж ${dayMacro(day,'f')} · У ${dayMacro(day,'c')}</span></div>`+day.map(e=>{
   const r=RID[e.id],key=d+'-'+e.m,open=!!S.open[key];
   if(!r) return '';
   return `<div class="meal"><div class="ml"><span>${SLOT[e.m]}</span><button class="lnk" data-a="swap" data-d="${d}" data-m="${e.m}">Заменить</button></div><button class="mn" data-a="toggle" data-k="${key}" aria-expanded="${open}">${esc(r.n)}<small>${r.t} мин · ${open?'скрыть':'рецепт'}</small><span class="macros">${macrosLine(r)}</span></button>${open?recipeHtml(r,f):''}</div>`;
  }).join('')+`</section>`).join('');
 }else{
  const by={};t.items.forEach(i=>(by[i.c]=by[i.c]||[]).push(i));
  const done=t.items.filter(i=>S.checked[i.k]).length;
  const groups=Object.keys(by).sort();
  body=`<p class="fine" id="cnt">Куплено ${done} из ${t.items.length}</p>`+groups.map(g=>`<div class="grp"><h3>${g}</h3>`+by[g].sort((x,y)=>x.n.localeCompare(y.n,'ru')).map(i=>`<label class="it${S.checked[i.k]?' done':''}"><input type="checkbox" data-check="${i.k}"${S.checked[i.k]?' checked':''}><span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span><span>${esc(i.n)}</span><b>${qty(i.u,i.q,false)}${i.packs>1?`<small>${i.packs} упак.</small>`:''}</b></label>`).join('')+`</div>`).join('')+
  `<div class="row"><button class="btn sm" data-a="copy">Скопировать список</button><button class="btn sm ghost" data-a="print">Распечатать</button></div>`;
 }
 return `<p class="kicker">Ваш план</p><h2>Меню на 7 дней</h2>
 <div class="sum"><div class="n" id="sumN" data-target="${est}">≈ ${money(est)}</div><p>на ${a.people} чел. на неделю. ${fit}</p><div class="src">Цены: ${esc(PRICE_META.source)} · ${esc(PRICE_META.updatedAt)}</div></div>
 ${S.relaxed?'<div class="note">Из-за ограничений в некоторых слотах вариантов мало — часть блюд могла не попасть под фильтры по времени или нелюбимым продуктам.</div>':''}
 ${tabs}${body}
 <div class="row"><button class="btn ghost sm" data-a="regen">Собрать заново</button><button class="btn ghost sm" data-a="restart">Пройти тест заново</button></div>
 <div class="foot">Цены ориентировочные и усреднённые, реальная стоимость зависит от региона и даты. Калорийность и КБЖУ приблизительные. Это не медицинская рекомендация — при заболеваниях и особых диетах посоветуйтесь с врачом.</div>`;
}
function countUp(){
 const el=document.getElementById('sumN'); if(!el) return;
 const target=+el.dataset.target||0;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent='≈ '+money(target);return}
 const dur=700, t0=performance.now();
 function step(t){
  const p=Math.min(1,(t-t0)/dur), v=Math.round(target*(1-Math.pow(1-p,3)));
  el.textContent='≈ '+money(v);
  if(p<1)requestAnimationFrame(step);
 }
 requestAnimationFrame(step);
}
function render(){
 let m='';
 if(S.screen==='intro')m=intro();else if(S.screen==='quiz')m=quiz();else if(S.screen==='load')m=loading();else m=result();
 app.innerHTML=head()+m;
 if(S.screen==='result'&&S.tab==='plan')countUp();
 const b=document.querySelector('[data-a="install"]'); if(b&&deferredPrompt)b.dataset.show='true';
}
function go(screen){
 if(document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.startViewTransition(()=>{S.screen=screen;render();window.scrollTo(0,0)});
 }else{S.screen=screen;render();window.scrollTo(0,0)}
}
function build(){
 S.screen='load';render();window.scrollTo(0,0);
 setTimeout(()=>{
  if(!S.a.seed)S.a.seed=Math.floor(Math.random()*1e9)+1;
  const g=generate(S.a);S.plan=g.plan;S.relaxed=g.relaxed;S.checked={};S.open={};S.tab='plan';save();go('result');
 },800);
}
function nextQ(){
 if(S.i<QUESTIONS.length-1){S.i++;prep();go('quiz')}else build();
}
function prep(){
 const q=QUESTIONS[S.i];
 if(q.id==='people'&&!S.a.people)S.a.people=1;
 if(q.id==='budget'&&!S.a.budget)S.a.budget=(S.a.people||1)*2500;
}
function copyText(){
 const t=totals(S.a,S.plan),by={};t.items.forEach(i=>(by[i.c]=by[i.c]||[]).push(i));
 return 'keenwiix food — список покупок\n\n'+Object.keys(by).sort().map(g=>g+'\n'+by[g].map(i=>'— '+i.n+': '+qty(i.u,i.q,false)+(i.packs>1?` (${i.packs} упак.)`:'')).join('\n')).join('\n\n');
}
function copy(btn){
 const text=copyText();
 const done=()=>{btn.textContent='Скопировано';setTimeout(()=>{btn.textContent='Скопировать список'},1500)};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback)}else fallback();
 function fallback(){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}
}
app.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,v=t.dataset.v;
  if(a==='home'){go('intro')}
 else if(a==='start'){S.a={};S.i=0;prep();go('quiz')}
 else if(a==='resume')go('result')
 else if(a==='install'){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;t.dataset.show='false'})}}
 else if(a==='theme'){toggleTheme()}
 else if(a==='back'){if(S.i>0){S.i--;go('quiz')}else go('intro')}
 else if(a==='next')nextQ()
 else if(a==='pick'){S.a[QUESTIONS[S.i].id]=v;render();setTimeout(nextQ,160)}
 else if(a==='dis'){const s=S.a.dislikes||(S.a.dislikes=[]);const i=s.indexOf(v);if(i<0)s.push(v);else s.splice(i,1);render()}
 else if(a==='inc'){S.a.people=Math.min(6,(S.a.people||1)+1);render()}
 else if(a==='dec'){S.a.people=Math.max(1,(S.a.people||1)-1);render()}
 else if(a==='tab'){S.tab=v;render()}
 else if(a==='toggle'){S.open[t.dataset.k]=!S.open[t.dataset.k];render()}
 else if(a==='swap'){swap(S.a,S.plan,+t.dataset.d,t.dataset.m,Math.random);save();render()}
 else if(a==='regen'){S.a.seed=Math.floor(Math.random()*1e9)+1;build()}
 else if(a==='restart'){S.a={};S.i=0;prep();go('quiz')}
 else if(a==='copy')copy(t)
 else if(a==='print')window.print();
});
app.addEventListener('input',e=>{
 if(e.target.matches('[data-range]')){S.a.budget=+e.target.value;document.getElementById('bv').textContent=money(S.a.budget)}
});
app.addEventListener('change',e=>{
 const c=e.target.closest('[data-check]');if(!c)return;
 S.checked[c.dataset.check]=c.checked;c.closest('.it').classList.toggle('done',c.checked);save();
 const items=totals(S.a,S.plan).items, n=items.length, d=items.filter(i=>S.checked[i.k]).length;
 const el=document.getElementById('cnt');if(el)el.textContent='Куплено '+d+' из '+n;
});

(async()=>{
 await loadPrices();
 render();
 if('serviceWorker' in navigator){
  try{ await navigator.serviceWorker.register('sw.js'); }catch(e){}
 }
})();

}

if(typeof module!=='undefined')module.exports={generate,totals,pool,RECIPES,ING,qty,dayKcal,swap,mulberry32,QUESTIONS};
</script>
</body>
